name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # يجبر Actions على Node.js 24

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create dist folder
        run: mkdir dist

      - name: Package EXE
        run: |
          npm install --global pkg
          pkg . --targets node24-win-x64 --output dist/MyApp.exe

      - name: List dist contents
        run: dir dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Windows
          path: dist/MyApp.exe
